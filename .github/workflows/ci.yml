name: Проверки Relay

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      windows_resource_probe:
        description: "Base64 JSON v1: четыре TS-файла одноразового Windows resource probe"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: CLI, Server, Web и Git Sync — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # В Windows используется Git Bash, а Bun и Git остаются нативными процессами.
        # pipefail сохраняет отказ команды при записи её журнала через tee.
        shell: bash --noprofile --norc -e -o pipefail {0}

    steps:
      - name: Получить исходники
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Установить Bun 1.4.3
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Установить Node.js для Vite
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Подготовить каталог журналов
        id: artifacts
        run: |
          directory=".artifacts/$(date -u +%F)/ci-${RUNNER_OS}-${RUNNER_ARCH}"
          mkdir -p "$directory"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "CI_LOG_DIR=$directory" >> "$GITHUB_ENV"

      - name: Проверить версии инструментов
        run: |
          bun -e '
            const expected = "1.4.3";
            const manifest = await Bun.file("package.json").json();
            const pinned = (await Bun.file(".bun-version").text()).trim();
            if (
              Bun.version !== expected ||
              pinned !== expected ||
              manifest.packageManager !== `bun@${expected}` ||
              manifest.engines?.bun !== expected
            ) {
              throw new Error("Версии Bun в окружении и репозитории должны совпадать с 1.4.3");
            }
            console.log(`Bun ${Bun.version} (${process.platform}/${process.arch})`);
          ' 2>&1 | tee "$CI_LOG_DIR/environment.log"
          git --version 2>&1 | tee -a "$CI_LOG_DIR/environment.log"

      - name: Установить зависимости по lock-файлу
        id: install
        run: |
          bun install --frozen-lockfile 2>&1 | tee "$CI_LOG_DIR/install.log"
          git diff --exit-code -- bun.lock 2>&1 | tee "$CI_LOG_DIR/lockfile.log"

      - name: Извлечь одноразовый Windows resource probe
        id: windows_resource_bundle
        if: ${{ !cancelled() && runner.os == 'Windows' && inputs.windows_resource_probe != '' && steps.install.outcome == 'success' }}
        run: |
          # Payload читается из файла события, без переноса в shell/env.
          bun -e '
            import { appendFileSync, mkdirSync, writeFileSync } from "node:fs";
            import { createHash } from "node:crypto";
            import { join, resolve } from "node:path";
            const event = await Bun.file(process.env.GITHUB_EVENT_PATH).json();
            const input = event.inputs?.windows_resource_probe;
            if (typeof input !== "string" || !input || input.length > 64000 || !/^[A-Za-z0-9+/]+={0,2}$/.test(input)) {
              throw new Error("Некорректный размер или Base64 Windows resource probe");
            }
            const bytes = Buffer.from(input, "base64");
            if (bytes.length > 48000 || bytes.toString("base64") !== input) {
              throw new Error("Неканонический или слишком большой Windows resource probe");
            }
            let bundle;
            try {
              bundle = JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(bytes));
            } catch {
              throw new Error("Некорректный UTF-8 JSON Windows resource probe");
            }
            const names = ["windows-resource-preload.ts", "windows-resource-snapshot.ts",
              "windows-resource-snapshot.types.ts", "windows-resource-snapshot.integration.test.ts"];
            if (!bundle || bundle.version !== 1 || Object.keys(bundle).length !== 2 ||
                !bundle.files || Array.isArray(bundle.files) || typeof bundle.files !== "object" ||
                Object.keys(bundle.files).length !== names.length ||
                !names.every(name => Object.hasOwn(bundle.files, name) &&
                  typeof bundle.files[name] === "string" && bundle.files[name].length > 0)) {
              throw new Error("Ожидался bundle v1 с четырьмя разрешёнными TS-файлами");
            }
            const directory = resolve(process.env.CI_LOG_DIR, "windows-resource-cleanup");
            const head = Bun.spawnSync(["git", "rev-parse", "HEAD"]);
            const git = Bun.spawnSync(["git", "--version"]);
            if (head.exitCode !== 0 || git.exitCode !== 0) {
              throw new Error("Не удалось сохранить HEAD и версию Git для probe");
            }
            const metadata = {
              version: bundle.version, bytes: bytes.length,
              sha256: createHash("sha256").update(bytes).digest("hex"),
              head: head.stdout.toString().trim(), githubSha: process.env.GITHUB_SHA,
              bun: Bun.version, git: git.stdout.toString().trim(),
              platform: process.platform, arch: process.arch,
              files: Object.fromEntries(names.map(name => [name, {
                bytes: Buffer.byteLength(bundle.files[name]),
                sha256: createHash("sha256").update(bundle.files[name]).digest("hex"),
              }])),
            };
            mkdirSync(directory, { recursive: true });
            mkdirSync(join(directory, "probe"));
            writeFileSync(join(directory, "bundle.json"), bytes, { flag: "wx" });
            for (const name of names) {
              writeFileSync(join(directory, "probe", name), bundle.files[name], { flag: "wx" });
            }
            writeFileSync(join(directory, "metadata.json"), JSON.stringify(metadata, null, 2), { flag: "wx" });
            appendFileSync(process.env.GITHUB_ENV, `WINDOWS_RESOURCE_REPORT_DIR=${directory}\n`);
            console.log(JSON.stringify(metadata, null, 2));
          ' 2>&1 | tee "$CI_LOG_DIR/windows-resource-bundle.log"

      - name: Проверить native Windows snapshot
        id: windows_resource_validation
        if: ${{ !cancelled() && runner.os == 'Windows' && inputs.windows_resource_probe != '' && steps.windows_resource_bundle.outcome == 'success' }}
        run: |
          bun test "$WINDOWS_RESOURCE_REPORT_DIR/probe/windows-resource-snapshot.integration.test.ts" 2>&1 | tee "$CI_LOG_DIR/windows-resource-validation.log"

      # Pre-rm snapshot меняет тайминг: успех адресного прогона не является lifetime-fix.
      - name: Наблюдать очистку Runtime SIGKILL normal
        if: ${{ !cancelled() && runner.os == 'Windows' && inputs.windows_resource_probe != '' && steps.windows_resource_validation.outcome == 'success' }}
        run: |
          bun test --cwd packages/project-runtime --preload "$WINDOWS_RESOURCE_REPORT_DIR/probe/windows-resource-preload.ts" ./tests/integration/process-guardian.integration.test.ts -t "SIGKILL только владельца даёт stdin-eof target: обычный вывод" 2>&1 | tee "$CI_LOG_DIR/windows-resource-runtime.log"

      - name: Наблюдать очистку Git refresh
        if: ${{ !cancelled() && runner.os == 'Windows' && inputs.windows_resource_probe != '' && steps.windows_resource_validation.outcome == 'success' }}
        run: |
          bun test --cwd apps/git-sync --preload "$WINDOWS_RESOURCE_REPORT_DIR/probe/windows-resource-preload.ts" ./tests/integration/exchange.integration.test.ts -t "refresh получает behind" 2>&1 | tee "$CI_LOG_DIR/windows-resource-git-refresh.log"

      - name: Проверить форматирование
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run format:check 2>&1 | tee "$CI_LOG_DIR/format.log"

      - name: Выполнить lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint 2>&1 | tee "$CI_LOG_DIR/lint.log"

      - name: Проверить типы
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run typecheck 2>&1 | tee "$CI_LOG_DIR/typecheck.log"

      - name: Собрать CLI, Server с Web и Git Sync
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run build 2>&1 | tee "$CI_LOG_DIR/build.log"

      # Все функциональные наборы запускаются на каждой ОС; платформенные условия принадлежат тестам.
      # Отказ одного независимого пакета сохраняет ошибку job, но не обрывает проверки остальных.
      - name: Модульные тесты
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun x --no-install turbo run test:unit --continue=always 2>&1 | tee "$CI_LOG_DIR/unit.log"

      - name: Интеграционные тесты
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun x --no-install turbo run test:integration --continue=always 2>&1 | tee "$CI_LOG_DIR/integration.log"

      - name: Процессные тесты CLI, Server и Git Sync
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun x --no-install turbo run test:process --filter=@relay/cli --filter=@relay/git-sync --filter=@relay/server --continue=always 2>&1 | tee "$CI_LOG_DIR/process.log"

      - name: Сквозные сценарии
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run test:e2e 2>&1 | tee "$CI_LOG_DIR/e2e.log"

      - name: Сохранить журналы проверок
        if: ${{ always() && steps.artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: ci-logs-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ steps.artifacts.outputs.directory }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  native-services:
    name: Пользовательская служба — ${{ matrix.platform }}
    # Эти labels должны выбирать одноразовые машины с уже открытой пользовательской сессией.
    # Preflight проваливает job, если hosted image не предоставляет нужный manager/token.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ${{ vars.RELAY_NATIVE_LINUX_RUNNER || 'ubuntu-latest' }}
          - platform: darwin
            runner: ${{ vars.RELAY_NATIVE_MACOS_RUNNER || 'macos-latest' }}
          - platform: win32
            runner: ${{ vars.RELAY_NATIVE_WINDOWS_RUNNER || 'windows-latest' }}
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}
    steps:
      - name: Получить исходники
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Установить Bun 1.4.3
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Установить Node.js для Vite
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Подготовить каталог журналов native service
        id: artifacts
        run: |
          directory=".artifacts/$(date -u +%F)/git-sync-implementation/finalization/native-service-ci"
          mkdir -p "$directory"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "CI_LOG_DIR=$directory" >> "$GITHUB_ENV"

      - name: Установить зависимости по lock-файлу
        run: bun install --frozen-lockfile 2>&1 | tee "$CI_LOG_DIR/install.log"

      - name: Собрать настоящие бинарники
        run: bun run build:cli 2>&1 | tee "$CI_LOG_DIR/build.log"

      - name: Проверить реальный manager и lifecycle собственной службы
        env:
          CI: "true"
          RELAY_NATIVE_SERVICE_TESTS: disposable-runner
          RELAY_NATIVE_SERVICE_PLATFORM: ${{ matrix.platform }}
        run: bun run test:native-service 2>&1 | tee "$CI_LOG_DIR/native-service.log"

      - name: Сохранить native service диагностику
        if: ${{ always() && steps.artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: native-service-${{ matrix.platform }}-${{ github.run_attempt }}
          path: ${{ steps.artifacts.outputs.directory }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
